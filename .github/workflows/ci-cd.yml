name: Pipeline CI/CD DevOps

on:
  push:
    branches: [ main, develop, principal ]
  pull_request:
    branches: [ main, principal ]

jobs:
  lint-and-test:
    name: Integración Continua (Calidad & Pruebas)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install

      - name: Análisis Estático de Código (Linter)
        run: npm run lint

      - name: Ejecutar Pruebas Unitarias e Integración
        run: npm test

      - name: Cargar Reporte de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build-and-push:
    name: Construcción y Publicación de Contenedor Docker
    needs: lint-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/principal') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y Publicar Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-app:${{ github.sha }}

  deploy:
    name: Despliegue Automatizado en Producción
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Simulación de Despliegue en Entorno Cloud
        run: |
          echo "Iniciando despliegue de la imagen con tag ${{ github.sha }}"
          echo "Realizando comprobación de estado en la URL de producción..."
          echo "Despliegue completado con éxito."